# ════════════════════════════════════════════════════════════════════════════════
# OTA Publish Workflow — Derived Arbitrage
#
# Triggers on every push to master (or manually via workflow_dispatch).
# Publishes a new JS & asset bundle to the "production" and "preview" EAS
# update channels so installed mobile apps automatically receive the update
# without requiring a full APK reinstall.
# ════════════════════════════════════════════════════════════════════════════════
name: OTA Update — Publish Bundle

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  publish-ota:
    name: Publish OTA Update
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js runtime
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm ci --prefer-offline

      # 4. Install EAS CLI globally
      - name: Install EAS CLI
        run: npm install --global eas-cli

      # 5. Authenticate with Expo using secret token
      - name: Authenticate with Expo
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # 6. Publish OTA update to both production and preview channels
      #    Ensures test devices and release installations both receive the bundle.
      - name: Publish OTA bundle
        run: |
          eas update \
            --channel production \
            --message "OTA: ${{ github.sha }} — ${{ github.event.head_commit.message }}" \
            --non-interactive
          eas update \
            --channel preview \
            --message "OTA: ${{ github.sha }} — ${{ github.event.head_commit.message }}" \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: 1

